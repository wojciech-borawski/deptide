name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci --legacy-peer-deps

      - name: Build the portable binaries
        run: npm run build:portable

      - name: Build the Linux bundles
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles appimage,deb

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp release/Deptide.exe "assets/Deptide-${{ matrix.platform }}.exe"
            cp release/deptide-cli.exe "assets/deptide-cli-${{ matrix.platform }}.exe"
          else
            cp release/Deptide "assets/Deptide-${{ matrix.platform }}"
            cp release/deptide-cli "assets/deptide-cli-${{ matrix.platform }}"
            cp target/release/bundle/appimage/*.AppImage "assets/Deptide-${{ matrix.platform }}.AppImage"
            cp target/release/bundle/deb/*.deb "assets/deptide-${{ matrix.platform }}.deb"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: assets/*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true

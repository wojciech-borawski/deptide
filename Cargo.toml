[workspace]
resolver = "2"
members = ["crates/deptide-core", "crates/deptide-desktop", "crates/deptide-cli"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
deptide-core = { path = "crates/deptide-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "signal"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
ignore = "0.4"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
